<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><style>
@font-face{font-family:"Noto Serif JP";font-weight:400;src:url("file:///home/box/.local/share/fonts/noto-jp/NotoSerifJP-Regular.ttf")}
@font-face{font-family:"Noto Serif JP";font-weight:700;src:url("file:///home/box/.local/share/fonts/noto-jp/NotoSerifJP-Bold.ttf")}
@font-face{font-family:"Noto Sans JP";font-weight:400;src:url("file:///home/box/.local/share/fonts/noto-jp/NotoSansJP-Regular.ttf")}
@font-face{font-family:"Noto Sans JP";font-weight:700;src:url("file:///home/box/.local/share/fonts/noto-jp/NotoSansJP-Bold.ttf")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:#f5f1e8;color:#1c1a19;
  font-family:"Noto Sans JP","Noto Sans CJK JP",sans-serif;
  position:relative;
}
.paper{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(28,26,25,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(28,26,25,.045) 1px,transparent 1px);
  background-size:30px 30px;background-position:-1px -1px;
}
.glow{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 28% 18%,rgba(255,255,255,.72),transparent 55%),
    radial-gradient(ellipse at 92% 88%,rgba(212,0,0,.05),transparent 48%);
}
.frame{
  position:absolute;left:22px;top:22px;right:22px;bottom:22px;
  border:1.5px solid rgba(28,26,25,.48);
}
.shell{
  position:absolute;left:56px;right:56px;top:48px;bottom:48px;
  display:grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1fr);
  gap:32px;
  align-items:stretch;
}
.left{
  display:flex;flex-direction:column;min-width:0;
  border-left:8px solid #d40000;
  padding-left:28px;
}
.meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  margin-bottom:18px;
}
.cat{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:36px;padding:0 14px;
  border:1.5px solid #1c1a19;
  font-size:18px;font-weight:700;letter-spacing:.18em;
  line-height:1;
}
.date{
  font-size:20px;letter-spacing:.06em;color:#5c5c5c;
}
.title{
  font-family:"Noto Serif JP","Noto Serif CJK JP",serif;
  font-weight:700;
  font-size:52px;
  line-height:1.28;
  letter-spacing:.03em;
  word-break:auto-phrase;
  overflow-wrap:anywhere;
  text-wrap:balance;
  max-width:100%;
}
.subtitle{
  margin-top:16px;
  font-size:24px;line-height:1.5;color:#5c5c5c;
  letter-spacing:.04em;
}
.left-foot{
  margin-top:auto;padding-top:24px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
}
.url{
  font-size:18px;letter-spacing:.06em;color:#5c5c5c;
}
.logo{
  height:54px;width:auto;display:block;flex:none;
}
.right{
  min-width:0;min-height:0;
  display:flex;align-items:center;justify-content:center;
}
.art-grid{
  width:100%;height:100%;
  display:grid;grid-template-rows:1fr 1fr;gap:16px;
  align-content:center;
}
.art-cell{
  margin:0;min-width:0;min-height:0;
  display:flex;flex-direction:column;gap:6px;
  justify-content:center;
}
.art-cell img{
  display:block;width:100%;height:auto;
  aspect-ratio:16/9;
  object-fit:cover;object-position:50% 42%;
  border:1.5px solid rgba(28,26,25,.45);
  background:#fff;
}
.art-cell figcaption{
  flex:none;
  font-size:18px;line-height:1.3;color:#1c1a19;
  letter-spacing:.04em;font-weight:700;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.channel-panel,.mark-panel{
  width:100%;height:100%;
  border:1.5px solid rgba(28,26,25,.45);
  border-top:8px solid #d40000;
  background:rgba(255,255,255,.82);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:28px;
}
.channel-panel .mark,.mark-panel .mark{
  width:168px;height:168px;object-fit:contain;
}
.ch-note,.mark-label{
  font-size:22px;font-weight:700;letter-spacing:.2em;color:#5c5c5c;
}
.ch-id{
  font-family:"Noto Serif JP","Noto Serif CJK JP",serif;
  font-size:36px;font-weight:700;letter-spacing:.04em;
}
.banner-panel{
  width:100%;height:100%;
  border:1.5px solid rgba(28,26,25,.45);
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  padding:48px 32px;
}
.banner-panel img{
  display:block;max-width:100%;max-height:100%;
  width:auto;height:auto;object-fit:contain;
}
/* タイトルがはみ出すときだけ少し縮める */
</style></head><body>
<div class="paper"></div><div class="glow"></div><div class="frame"></div>
<div class="shell">
  <div class="left">
    <div class="meta">
      <span class="cat">採用</span>
      <span class="date"><time datetime="2026-09-22">令和8年9月22日</time></span>
    </div>
    <h1 class="title" data-min="40">開発アルバイト・<br>インターン募集</h1>
    <p class="subtitle">正社員の募集ではありません</p>
    <div class="left-foot">
      <span class="url">sanogumi.biz/careers</span>
      <img class="logo" src="file:///workspace/sanogumi/web/assets/logo/kanji-logo-512.png" alt="">
    </div>
  </div>
  <div class="right"><div class="mark-panel">
  <img class="mark" src="file:///workspace/sanogumi/web/assets/img/topics/_build/s-logo-mark.png" alt="">
  <p class="mark-label">CAREERS</p>
</div></div>
</div>
<script>
(function () {
  const el = document.querySelector('.title');
  if (!el) return;
  const min = +el.dataset.min || 40;
  let size = parseFloat(getComputedStyle(el).fontSize);
  const left = el.closest('.left');
  const fits = () => el.getBoundingClientRect().bottom <= left.querySelector('.left-foot').getBoundingClientRect().top - 8;
  while (!fits() && size > min) {
    size -= 2;
    el.style.fontSize = size + 'px';
  }
})();
</script>
</body></html>
