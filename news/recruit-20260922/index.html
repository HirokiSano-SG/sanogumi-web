      <p class="blog-dates">
        <span>掲載 <time datetime="2026-09-22">令和8年9月22日</time></span>
      </p>
      <p>株式会社佐野組は、自社ゲームタイトルの開発を補助するアルバイト、または実務のあるインターンを募集しています。正社員の募集ではありません。</p>
      <p>面接も勤務も、原則リモート（オンライン）です。作業用のパソコンは私物を使い、会社からの貸与はありません。採用のときは、秘密保持契約（NDA）の締結が必須です。</p>
      <p>勤務時間、賃金、応募先は<a href="/careers/dev-intern-20260922/">募集のページ</a>に書いています。</p>
